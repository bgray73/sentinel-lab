services:
  sentinel:
    image: ${SENTINEL_IMAGE:-sentinel-lab:local}
    build:
      context: ../..
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SENTINEL_BIND_ADDRESS:-127.0.0.1}:${SENTINEL_PORT:-4100}:4100"
    environment:
      PORT: 4100
      DATABASE_PATH: /var/lib/sentinel/sentinel.db
      SENTINEL_DATA_FILE: /var/lib/sentinel/monitoring.json
      SENTINEL_TELEMETRY_FILE: /var/lib/sentinel/telemetry.json
      SENTINEL_CMDB_FILE: /var/lib/sentinel/cmdb.json
      SENTINEL_HARDWARE_OPERATIONS_FILE: /var/lib/sentinel/hardware-operations.json
      SENTINEL_AUTH_AUDIT_FILE: /var/lib/sentinel/security-audit.json
      SENTINEL_COLLECTOR_FILE: /var/lib/sentinel/collectors.json
      SENTINEL_SERVICENOW_CMDB_FILE: /var/lib/sentinel/servicenow-cmdb.json
      SENTINEL_AUTH_AUDIT_RETENTION_DAYS: ${SENTINEL_AUTH_AUDIT_RETENTION_DAYS:-90}
      SENTINEL_AUTH_AUDIT_MAX_EVENTS: ${SENTINEL_AUTH_AUDIT_MAX_EVENTS:-10000}
      SENTINEL_BACKUP_DIR: /var/lib/sentinel/backups
      SENTINEL_RESTORE_POINT_DIR: /var/lib/sentinel/restore-points
      SENTINEL_BACKUPS_ENABLED: ${SENTINEL_BACKUPS_ENABLED:-true}
      SENTINEL_BACKUP_INTERVAL_HOURS: ${SENTINEL_BACKUP_INTERVAL_HOURS:-24}
      SENTINEL_BACKUP_MAX_COUNT: ${SENTINEL_BACKUP_MAX_COUNT:-14}
      SENTINEL_BACKUP_REPLICA_DIR: ${SENTINEL_BACKUP_REPLICA_DIR:-}
      SENTINEL_REAL_CHECKS: ${SENTINEL_REAL_CHECKS:-false}
      SENTINEL_REAL_NOTIFICATIONS: ${SENTINEL_REAL_NOTIFICATIONS:-false}
      SENTINEL_WEBHOOK_URL: ${SENTINEL_WEBHOOK_URL:-}
      SENTINEL_WEBHOOK_URL_FILE: ${SENTINEL_WEBHOOK_URL_FILE:-}
      SENTINEL_SLACK_WEBHOOK_URL: ${SENTINEL_SLACK_WEBHOOK_URL:-}
      SENTINEL_SLACK_WEBHOOK_URL_FILE: ${SENTINEL_SLACK_WEBHOOK_URL_FILE:-}
      SENTINEL_TEAMS_WEBHOOK_URL: ${SENTINEL_TEAMS_WEBHOOK_URL:-}
      SENTINEL_TEAMS_WEBHOOK_URL_FILE: ${SENTINEL_TEAMS_WEBHOOK_URL_FILE:-}
      SENTINEL_SMTP_URL: ${SENTINEL_SMTP_URL:-}
      SENTINEL_SMTP_URL_FILE: ${SENTINEL_SMTP_URL_FILE:-}
      SENTINEL_ALERT_EMAIL_TO: ${SENTINEL_ALERT_EMAIL_TO:-}
      SENTINEL_ALERT_EMAIL_FROM: ${SENTINEL_ALERT_EMAIL_FROM:-}
      SENTINEL_SERVICENOW_URL: ${SENTINEL_SERVICENOW_URL:-}
      SENTINEL_SERVICENOW_USERNAME: ${SENTINEL_SERVICENOW_USERNAME:-}
      SENTINEL_SERVICENOW_PASSWORD: ${SENTINEL_SERVICENOW_PASSWORD:-}
      SENTINEL_SERVICENOW_PASSWORD_FILE: ${SENTINEL_SERVICENOW_PASSWORD_FILE:-}
      SENTINEL_SERVICENOW_TOKEN: ${SENTINEL_SERVICENOW_TOKEN:-}
      SENTINEL_SERVICENOW_TOKEN_FILE: ${SENTINEL_SERVICENOW_TOKEN_FILE:-}
      SENTINEL_REAL_SERVICENOW_CMDB: ${SENTINEL_REAL_SERVICENOW_CMDB:-false}
      SENTINEL_SERVICENOW_CMDB_SOURCE: ${SENTINEL_SERVICENOW_CMDB_SOURCE:-Other Automated}
      SENTINEL_SERVICENOW_CMDB_FEED: ${SENTINEL_SERVICENOW_CMDB_FEED:-SentinelLab}
      SENTINEL_SERVICENOW_CMDB_INTERVAL_MINUTES: ${SENTINEL_SERVICENOW_CMDB_INTERVAL_MINUTES:-60}
      SENTINEL_SERVICENOW_AUTO_CHANGE: ${SENTINEL_SERVICENOW_AUTO_CHANGE:-false}
      SENTINEL_REAL_TELEMETRY: ${SENTINEL_REAL_TELEMETRY:-false}
      SENTINEL_REAL_CMDB: ${SENTINEL_REAL_CMDB:-false}
      SENTINEL_REAL_HARDWARE: ${SENTINEL_REAL_HARDWARE:-false}
      SENTINEL_AUTH_MODE: ${SENTINEL_AUTH_MODE:-disabled}
      SENTINEL_AUTH_PROXY_SECRET: ${SENTINEL_AUTH_PROXY_SECRET:-}
      SENTINEL_AUTH_PROXY_SECRET_FILE: ${SENTINEL_AUTH_PROXY_SECRET_FILE:-}
      SENTINEL_AUTH_ADMIN_GROUPS: ${SENTINEL_AUTH_ADMIN_GROUPS:-sentinel-admins}
      SENTINEL_AUTH_OPERATOR_GROUPS: ${SENTINEL_AUTH_OPERATOR_GROUPS:-sentinel-operators}
      SENTINEL_METRICS_TOKEN: ${SENTINEL_METRICS_TOKEN:-}
      SENTINEL_METRICS_TOKEN_FILE: ${SENTINEL_METRICS_TOKEN_FILE:-}
      PVE_URL: ${PVE_URL:-}
      PVE_TOKEN_ID: ${PVE_TOKEN_ID:-}
      PVE_TOKEN_SECRET: ${PVE_TOKEN_SECRET:-}
      PVE_TOKEN_SECRET_FILE: ${PVE_TOKEN_SECRET_FILE:-}
      LOKI_URL: ${LOKI_URL:-}
      LABOPS_EXPORT_TOKEN: ${LABOPS_EXPORT_TOKEN:-}
      LABOPS_EXPORT_TOKEN_FILE: ${LABOPS_EXPORT_TOKEN_FILE:-}
      SENTINEL_REDFISH_TARGETS: "${SENTINEL_REDFISH_TARGETS:-[]}"
      SNMP_EXPORTER_URL: ${SNMP_EXPORTER_URL:-}
      SENTINEL_SNMP_TARGETS: "${SENTINEL_SNMP_TARGETS:-[]}"
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - sentinel-data:/var/lib/sentinel
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sentinel-data:
